<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Himaya Facebook cover 1640x924</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=block">
<style>
  /*
    Facebook cover: 1640×924 upload.
    Phones show the whole image (16:9); desktop crops it to the middle band (y≈150–774).
    All content stays inside that band.
  */
  html, body { margin: 0; width: 1640px; height: 924px; overflow: hidden; }
  body {
    font-family: "IBM Plex Sans Arabic", sans-serif;
    background:
      radial-gradient(ellipse 55% 70% at 22% 50%, rgba(26, 158, 104, 0.16), transparent 70%),
      radial-gradient(ellipse 60% 80% at 85% 20%, rgba(26, 58, 110, 0.9), transparent 70%),
      linear-gradient(160deg, #102a56 0%, #0b1b3a 55%, #071430 100%);
    color: #fff;
  }
  .wrap {
    position: absolute; inset: 150px 110px; /* desktop-safe band */
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
  }
  .text { width: 880px; }
  .brand { display: inline-flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .brand svg { width: 64px; height: 64px; }
  .brand span { font-weight: 700; font-size: 46px; line-height: 1; }
  h1 { margin: 0; font-weight: 700; font-size: 74px; line-height: 1.32; letter-spacing: -0.005em; }
  p { margin: 18px 0 0; font-size: 31px; line-height: 1.7; color: rgba(255,255,255,0.78); font-weight: 400; }
  bdi { unicode-bidi: isolate; }
  .row { display: flex; align-items: center; gap: 26px; margin-top: 30px; }
  .price {
    display: inline-flex; align-items: baseline; gap: 12px;
    padding: 12px 28px; border-radius: 18px; background: #1a9e68;
    box-shadow: 0 14px 30px -10px rgba(26, 158, 104, 0.6);
  }
  .price { white-space: nowrap; flex-shrink: 0; }
  .price b { font-size: 46px; font-weight: 700; line-height: 1.3; }
  .price small { font-size: 22px; color: rgba(255,255,255,0.85); }
  .checks { display: flex; flex-direction: column; gap: 6px; font-size: 25px; color: rgba(255,255,255,0.88); font-weight: 500; white-space: nowrap; }
  .checks span { display: inline-flex; align-items: center; gap: 8px; }
  .checks svg { width: 26px; height: 26px; }
  .art { width: 560px; flex-shrink: 0; }
  .art svg { width: 100%; height: auto; display: block; }
</style>
</head>
