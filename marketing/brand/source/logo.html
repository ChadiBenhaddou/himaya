<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Himaya logo lockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@700&display=block">
<style>
  /* Rendered one variant at a time via ?v=dark | white | icon (transparent background). */
  html, body { margin: 0; background: transparent; }
  body { font-family: "IBM Plex Sans Arabic", sans-serif; }
  .lockup { display: inline-flex; align-items: center; gap: 110px; padding: 80px; direction: rtl; }
  .lockup svg { width: 520px; height: 520px; display: block; }
  .lockup span { font-weight: 700; font-size: 400px; line-height: 1; }
  .dark span { color: #0b1b3a; }
  .white span { color: #ffffff; }
  .icon { padding: 0; }
  .icon svg { width: 2048px; height: 2048px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script>
    var v = new URLSearchParams(location.search).get("v") || "dark";
    var tile = v === "white" ? "#ffffff" : "#102a56";
    var svg =
      '<svg viewBox="0 0 34 34" aria-hidden="true">' +
      '<rect width="34" height="34" rx="10" fill="' + tile + '"/>' +
      '<path d="M17 7.5 24.5 10.5v5.4c0 4.6-3.1 8.5-7.5 10.1-4.4-1.6-7.5-5.5-7.5-10.1v-5.4L17 7.5Z" fill="#1a9e68"/>' +
      '<path d="m13.6 16.6 2.4 2.4 4.4-4.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      "</svg>";
    document.getElementById("root").innerHTML =
      v === "icon"
        ? '<div class="lockup icon">' + svg + "</div>"
        : '<div class="lockup ' + v + '">' + svg + "<span>حماية</span></div>";
  </script>
</body>
</html>
